<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; overflow: hidden; }
  .bg {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 40%, #0ea5e9 100%);
    position: relative; padding: 56px 64px;
    display: flex; flex-direction: column;
  }
  .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
    top: -160px; right: -120px; }
  .glow2 { position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(52,211,153,0.16), transparent 70%);
    bottom: -160px; left: -100px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .logo { width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, #60a5fa, #34d399);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #fff; }
  .brand { color: #fff; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
  .badge { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px; padding: 8px 18px; color: #dbeafe; font-size: 17px; }
  .title { margin-top: 34px; color: #fff; font-size: 56px; font-weight: 800; line-height: 1.2; }
  .sub { margin-top: 16px; color: #dbeafe; font-size: 22px; }
  .formats { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,0.14); border-radius: 12px; padding: 10px 18px;
    color: #fff; font-size: 18px; font-weight: 600; }
  .foot { margin-top: auto; color: #bfdbfe; font-size: 17px; }
</style>
</head>
<body>
  <div class="bg">
    <div class="glow"></div><div class="glow2"></div>
    <div class="top">
      <div class="logo">F</div>
      <div class="brand">FilePomelo</div>
    </div>
    <div class="badge">⚡ 100% 本地处理 · 文件不上传</div>
    <div class="title">在线压缩图片、PDF、<br>视频和音频</div>
    <div class="sub">所有压缩都在浏览器内完成，免费、无需注册</div>
    <div class="formats">
      <div class="chip">🖼 图片</div><div class="chip">📄 PDF</div>
      <div class="chip">🎬 视频</div><div class="chip">🎵 音频</div><div class="chip">🗜 ZIP</div>
    </div>
    <div class="foot">filepomelo.com</div>
  </div>
</body>
</html>
